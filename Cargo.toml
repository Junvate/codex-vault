[package]
name = "codex-vault"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Encrypted, multi-user local state isolation for the Codex CLI"
license = "Apache-2.0"
keywords = ["codex", "security", "encryption", "cli"]
categories = ["command-line-utilities", "cryptography"]
publish = false

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = { version = "0.6.0", features = ["zeroize"] }
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
fs2 = "0.4.3"
getrandom = "0.4.3"
nix = { version = "0.31.3", features = ["process", "signal", "user"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v4"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
